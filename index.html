<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overdraft launch countdown</title>
<style>
  :root {
    --bg: #0b0b0d;
    --card: #16161a;
    --border: #2a2a30;
    --text: #f4f4f2;
    --muted: #8a8a92;
    --accent: #35d07f;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f6f4;
      --card: #ffffff;
      --border: #e2e2de;
      --text: #14140f;
      --muted: #6b6b66;
      --accent: #128a52;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --card: #16161a;
    --border: #2a2a30;
    --text: #f4f4f2;
    --muted: #8a8a92;
    --accent: #35d07f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px);
  }
  .wrap {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 12px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 8px;
  }
  .num {
    font-size: clamp(28px, 8vw, 48px);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 8px;
  }
  .target {
    margin-top: 32px;
    font-size: 14px;
    color: var(--muted);
  }
  .done {
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 700;
    color: var(--accent);
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Coming soon</p>
  <h1>Overdraft is launching</h1>
  <p class="sub">Counting down to launch day</p>

  <div id="countdown" class="grid">
    <div class="cell"><div class="num" id="days">--</div><div class="label">Days</div></div>
    <div class="cell"><div class="num" id="hours">--</div><div class="label">Hours</div></div>
    <div class="cell"><div class="num" id="minutes">--</div><div class="label">Minutes</div></div>
    <div class="cell"><div class="num" id="seconds">--</div><div class="label">Seconds</div></div>
  </div>

  <p class="target" id="targetLabel"></p>
</div>

<script>
  var target = new Date("2026-10-26T00:00:00");

  var elDays = document.getElementById("days");
  var elHours = document.getElementById("hours");
  var elMinutes = document.getElementById("minutes");
  var elSeconds = document.getElementById("seconds");
  var elTargetLabel = document.getElementById("targetLabel");
  var wrap = document.querySelector(".wrap");

  elTargetLabel.textContent = "Launching " + target.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function tick() {
    var now = new Date();
    var diff = target.getTime() - now.getTime();

    if (diff <= 0) {
      wrap.innerHTML = '<p class="eyebrow">Overdraft</p><div class="done">We are live</div>';
      clearInterval(timer);
      return;
    }

    var days = Math.floor(diff / (1000 * 60 * 60 * 24));
    var hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    var minutes = Math.floor((diff / (1000 * 60)) % 60);
    var seconds = Math.floor((diff / 1000) % 60);

    elDays.textContent = days;
    elHours.textContent = pad(hours);
    elMinutes.textContent = pad(minutes);
    elSeconds.textContent = pad(seconds);
  }

  tick();
  var timer = setInterval(tick, 1000);
</script>

</body>
</html>
