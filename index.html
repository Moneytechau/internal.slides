<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overdraft launch countdown</title>
<style>
  :root {
    --bg: #0b0b0d;
    --card: #16161a;
    --border: #2a2a30;
    --text: #f4f4f2;
    --muted: #8a8a92;
    --accent: #35d07f;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f6f4;
      --card: #ffffff;
      --border: #e2e2de;
      --text: #14140f;
      --muted: #6b6b66;
      --accent: #128a52;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0d;
    --card: #16161a;
    --border: #2a2a30;
    --text: #f4f4f2;
    --muted: #8a8a92;
    --accent: #35d07f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px);
  }
  .wrap {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 12px;
  }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 8px;
  }
  .num {
    font-size: clamp(28px, 8vw, 48px);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 8px;
  }
  .target {
    margin-top: 32px;
    font-size: 14px;
    color: var(--muted);
  }
  .done {
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 700;
    color: var(--accent);
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">New product coming</p>
  <h1>Overdraft is launching soon</h1>
  <p class="sub">Pushing to launch as soon as possible</p>
  
</div>

</body>
</html>
